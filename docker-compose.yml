version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: medislot-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  web:
    build: .
    container_name: medislot-web
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/medislot-ai
      - PORT=3001
      - SUSPICION_THRESHOLD=0.55
      - RAG_TOP_K=3
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo-data:
